<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Department of Electrical Engineering | SIT</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .department-card {
            width: 100%;
            max-width: 560px;
            background: white;
            border-radius: 20px;
            padding: 35px 30px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
        }

        .logo {
            width: 150px;
            max-width: 60%;
            margin-bottom: 15px;
        }

        h1 {
            margin: 10px 0 8px;
            font-size: 28px;
            color: #19366d;
        }

        .subtitle {
            font-size: 19px;
            font-weight: bold;
            color: #444;
            margin-bottom: 8px;
        }

        .institute {
            font-size: 16px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 25px;
        }

        .buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-top: 25px;
        }

        .button {
            display: block;
            padding: 16px 20px;
            background: #19366d;
            color: white;
            text-decoration: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            transition: 0.2s;
        }

        .button:hover {
            background: #10264f;
        }

        .button.secondary {
            background: #00695c;
        }

        .button.secondary:hover {
            background: #004d40;
        }

        .footer {
            margin-top: 25px;
            font-size: 13px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="department-card">

        <!-- Optional: replace with your department/SIT logo -->
        <img src="sit-logo.png"
             alt="Siliguri Institute of Technology"
             class="logo">

        <h1>Department of Electrical Engineering</h1>

        <div class="subtitle">
            Siliguri Institute of Technology
        </div>

        <div class="institute">
            Techno India Group<br>
            Siliguri, West Bengal, India
        </div>

        <div class="buttons">

            <a
                class="button"
                href="https://www.sittechno.org/electrical-engineering-engineering-technology.html"
                target="_blank">
                ⚡ Department Details
            </a>

            <a
                class="button secondary"
                href="https://www.sittechno.org/faculty-staff-directory.html"
                target="_blank">
                👨‍🏫 Faculty List
            </a>

        </div>

        <div class="footer">
            Official SIT Department Resources
        </div>

    </div>

</body>
</html>
